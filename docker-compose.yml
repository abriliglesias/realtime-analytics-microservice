version: "3.9"

# ---------------------------------------------------------------------------
# HEALTH-CHECK STRATEGY
#
# Kafka has a well-known startup race: the JVM process and port 9092 become
# available before the broker is actually ready to accept client connections.
# Using `depends_on` with the default `service_started` condition is therefore
# not sufficient — the Go services will fail with "connection refused" or
# "leader not available" errors on first boot.
#
# Solution: give Kafka a REAL health check that uses a native Kafka script
# (kafka-topics.sh --list) to verify the broker can service metadata requests.
# The Go services then use `condition: service_healthy` so Docker Compose
# holds them in a "waiting" state until Kafka passes.
# ---------------------------------------------------------------------------

services:
  # INFRASTRUCTURE SERVICES
  zookeeper:
  # -------------------------------------------------------------------------
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      # nc -z verifies the ZooKeeper port is accepting TCP connections.
      test: ["CMD-SHELL", "nc -z localhost 2181 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # -------------------------------------------------------------------------
  kafka:
  # -------------------------------------------------------------------------
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      # kafka-topics.sh --list attempts a real metadata request against the
      # broker. It only succeeds once the broker has fully joined ZooKeeper,
      # elected a controller, and is ready to handle client connections.
      # This is the most reliable built-in probe available without extra tooling.
      test:
        - "CMD-SHELL"
        - "kafka-topics --bootstrap-server localhost:9092 --list > /dev/null 2>&1 || exit 1"
      interval: 15s
      timeout: 10s
      retries: 10
      # Give Kafka's JVM extra time before the first probe fires.
      start_period: 30s

  # INFRASTRUCTURE DATABASE -------------------------------------------------------------------------
  postgres:
  # -------------------------------------------------------------------------
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: analytics
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # pg_isready exits 0 only when Postgres is accepting connections.
      test: ["CMD-SHELL", "pg_isready -U user -d analytics"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # GO MICROSERVICES -------------------------------------------------------------------------
  
  producer:
    build:
      context: .                        
      dockerfile: producer/Dockerfile   
    ports:
      - "${PRODUCER_PORT:-8081}:8081"
    environment:
      KAFKA_BROKER: kafka:9092
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      SERVER_PORT: "8081"
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: on-failure
 
  consumer:
    build:
      context: .                       
      dockerfile: consumer/Dockerfile
    environment:
      KAFKA_BROKER: kafka:9092
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: on-failure

volumes:
  postgres_data: