version: '3.8'

services:
  # INFRASTRUCTURE: KAFKA AND ZOOKEEPER ------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: analytics-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: analytics-kafka
    ports:
      - "9092:9092"
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Listener configuration to allow internal (within Docker) and external (from your machine) connections
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 5

  # INFRASTRUCTURE: DATABASE ------
  postgres:
    image: postgres:15-alpine
    container_name: analytics-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: analytics_user
      POSTGRES_PASSWORD: analytics_password
      POSTGRES_DB: analytics_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analytics_user -d analytics_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # GO MICROSERVICES ------
  producer:
    build:
      context: ./producer
      dockerfile: Dockerfile
    container_name: analytics-producer
    ports:
      - "8080:8080"
    environment:
      - KAFKA_BROKERS=kafka:29092
      - SERVER_PORT=8080
    depends_on:
      kafka:
        condition: service_healthy

  consumer:
    build:
      context: ./consumer
      dockerfile: Dockerfile
    container_name: analytics-consumer
    environment:
      - KAFKA_BROKERS=kafka:29092
      - DATABASE_URL=postgres://analytics_user:analytics_password@postgres:5432/analytics_db?sslmode=disable
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy

volumes:
  postgres_data: