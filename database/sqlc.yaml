version: "2"
sql:
  - schema: "schema/schema.sql"
    queries: "queries/queries.sql"
    engine: "postgresql"
    gen:
      go:
        package: "db"
        out: "../internal/db"
        sql_package: "pgx/v5"
        emit_prepared_queries: false
        emit_interface: true          # generates Querier interface — needed for mocking in tests
        emit_exact_table_names: false
        emit_empty_slices: true
        emit_json_tags: true